name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # A four-version matrix restarted on every push to a PR branch, with nothing
  # cancelling the superseded run. Scoped to workflow AND ref so a PR cancelling
  # its own older run can never reach main's.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, and the packaging
          # smoke test below runs `python -m build`. The default shallow
          # checkout fetches no tags, so the build would either fail or produce
          # a version derived from nothing. Full depth is required for the
          # BUILD, not for the tests.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # stdlib only — nothing to install to run the suite
      - name: Run the test suite (warnings are errors)
        run: python -m unittest discover -s tests -v
      - name: Fail on leaked file handles
        run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Packaging + console-script smoke test
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          corpuslens --help
          corpuslens run examples/sample-corpus --adapter claude-code > /tmp/report.md
          grep -q "No absolute calendar date, timezone, or filename left the wall" /tmp/report.md

  # Aggregate gate: branch protection requires a single check named exactly
  # "test" across the whole fleet, so the ruleset never has to name a matrix
  # cell. Pinning a cell name means the required check silently stops
  # reporting the moment the matrix is re-shaped. Green only when every leg is.
  test:
    needs: [test-matrix]
    # `if: always()` is load-bearing, not boilerplate. Without it a failing
    # dependency does not fail this job — it SKIPS it, because that is what
    # `needs:` means. GitHub does not treat a skipped required check as a
    # blocker, so the one check branch protection trusts goes quiet at exactly
    # the moment it matters, and the pull request becomes mergeable with a red
    # suite underneath it. Observed directly on willows-grove#5: `test-suite`
    # failed, `test` reported `skipping`, and the PR read MERGEABLE.
    #
    # So the result is asserted explicitly rather than inferred from this job
    # having run at all. Same shape as homestead/ci.yml and willow-mcp.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every matrix leg actually succeeded
        # skipped and cancelled count as failures: a leg that did not run has
        # told us nothing, and this gate speaks for all of them.
        if: ${{ needs.test-matrix.result != 'success' }}
        run: |
          echo "::error::test-matrix did not succeed (result: ${{ needs.test-matrix.result }})"
          exit 1
      - run: echo "all matrix legs green"
