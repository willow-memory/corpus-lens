[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# THREE NAMES, on purpose — do not "tidy" them into one:
#   * distribution (PyPI):  willow-corpus-lens  — this line
#   * import package:       corpuslens          — [tool.hatch.build.targets.wheel]
#   * console script:       corpuslens          — [project.scripts]
#
# `corpus-lens` on PyPI is already an unrelated project (a TF-IDF corpus
# dashboard, MIT, godofecht/corpus-lens), so the fleet prefix disambiguates
# rather than competes. This name must match the PyPI Trusted Publishing
# pending publisher EXACTLY (repository willow-memory/corpus-lens, workflow
# release.yml, environment pypi) — a mismatch is rejected at upload with no
# useful error, and the artifact name in release.yml's tag assertion is derived
# from this too.
name = "willow-corpus-lens"
# The git tag is the single source of truth — see [tool.hatch.version]. A
# literal here is a second copy that drifts: the fleet has shipped a tag whose
# build produced the previous version because a literal went unbumped, and this
# file carried `0.1.0` with no tag and no release, a number never true of
# anything installed.
dynamic = ["version"]
description = "Local-first process lens for your own human+agent corpus — reads process; the wall keeps the absolute time anchor out of the analysis"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Campbell" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["corpus", "agent-sessions", "process-analysis", "local-first", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/willow-memory/corpus-lens"
Changelog = "https://github.com/willow-memory/corpus-lens/blob/main/CHANGELOG.md"
Rubric = "https://github.com/willow-memory/corpus-lens/blob/main/GRADING.md"

[project.scripts]
corpuslens = "corpuslens.cli:main"

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; an off-tag build gets a `.devN+g<sha>` suffix that PyPI rejects, so a
# publish from an untagged commit fails loudly instead of shipping something
# mislabelled. CI must check out with `fetch-depth: 0` or no tags are present.
#
# Cutting a release is release-please's job (`release-please-config.json`,
# `release-type: simple`) — let it pick the number from the commits rather than
# tagging by hand.
#
# CORRECTED 2026-09-11: this comment used to claim that a 0.0.0 manifest makes
# the first `feat:` propose v0.1.0. It does not. With no prior release,
# release-please's FIRST release is 1.0.0 whatever the manifest says, and that
# is what it cut and published before the claim was tested. Forcing a specific
# number takes `Release-As: <version>` in a commit footer, or `initial-version`
# in the config before the first release. Every release after the first does
# bump from the manifest as described.
source = "vcs"

[tool.hatch.build.targets.wheel]
# The import name stays `corpuslens` — `import corpuslens`, and the console
# script is `corpuslens` too. Only the distribution name carries the fleet
# prefix, the same split forge-play/forge uses.
packages = ["corpuslens"]
